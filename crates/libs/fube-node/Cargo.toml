[package]
name = "fube-node"
version = "0.1.0"
edition = "2021"

[features]
qualification = ["fube-hosting/qualification"]

[dependencies]
fube-hosting = { path = "../fube-hosting" }
fube-ra = { path = "../fube-ra" }
uuid = { workspace = true }
fube-ra-store = { path = "../fube-ra-store" }
furpc.workspace = true
tower-service.workspace = true
fubst.workspace = true
serde = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
fube-ra = { path = "../fube-ra", features = ["qualification"] }
fube-rap-test-support.workspace = true
