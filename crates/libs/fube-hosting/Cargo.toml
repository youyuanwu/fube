[package]
name = "fube-hosting"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bounded Hosting2 registration, residency and bootstrap-only local IPC leases"

[dependencies]
fube-local-host = { path = "../fube-local-host" }
uuid.workspace = true
fube-transport.workspace = true
serde.workspace = true
tokio.workspace = true

[dev-dependencies]
socket2 = { version = "0.6", features = ["all"] }
fube-ra = { path = "../fube-ra" }
fube-ra-store = { path = "../fube-ra-store" }
tokio.workspace = true
