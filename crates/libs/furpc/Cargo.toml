[package]
name = "furpc"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Service Fabric native RPC transport"

[dependencies]
fubst.workspace = true
serde.workspace = true
tokio.workspace = true
uuid.workspace = true
bytes = "1"
http = "1"
tower-service = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
tracing = "0.1"
crc32fast.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
