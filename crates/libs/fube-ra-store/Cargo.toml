[package]
name = "fube-ra-store"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bounded logical RA typed-record storage"

[dependencies]
tokio.workspace = true
tokio-rusqlite = { version = "0.8.0", features = ["bundled", "limits"] }
libc = "0.2"

[dev-dependencies]
tokio-rusqlite = { version = "0.8.0", features = ["hooks"] }
