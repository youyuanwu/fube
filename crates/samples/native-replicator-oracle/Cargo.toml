[package]
name = "native-replicator-oracle"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Test-only native classic replicator ABI fixture; not a production runtime"

[dependencies]
mssf-core = "0.10"
mssf-com = { version = "0.10", features = ["ServiceFabric_FabricRuntime", "ServiceFabric_FabricCommon", "ServiceFabric_FabricTypes"] }
windows_core = { package = "mssf-pal", version = "0.10" }
windows-interface = "0.100"
serde_json = "1"
fube-data.workspace = true
tokio.workspace = true
mssf-util.workspace = true
uuid.workspace = true
