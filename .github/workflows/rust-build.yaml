name: Rust artifact producer

on:
  workflow_call:
    outputs:
      nextest-version:
        description: Pinned nextest version used to build the test archive
        value: ${{ jobs.rust-build.outputs.nextest-version }}
      onebox-matrix:
        description: Onebox partitions declared in tests/suites.toml
        value: ${{ jobs.rust-build.outputs.onebox-matrix }}
      producer-attempt:
        description: Attempt that built and published the immutable inputs
        value: ${{ jobs.rust-build.outputs.producer-attempt }}

env:
  NEXTEST_VERSION: "0.9.146"

jobs:
  rust-build:
    name: Build Rust artifacts (Ubuntu 22.04 ABI)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      nextest-version: ${{ env.NEXTEST_VERSION }}
      onebox-matrix: ${{ steps.suites.outputs.matrix }}
      producer-attempt: ${{ steps.producer.outputs.attempt }}
    env:
      FUBE_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      FUBE_CI_MERGE: ${{ github.event_name == 'pull_request' && github.sha || '' }}
      FUBE_CI_RUN_ID: ${{ github.run_id }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install Rust toolchain with cache
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        cache: true
        rustflags: ""

    - name: Build all workspace executables and examples
      run: cargo build --locked --workspace --bins --examples --all-features

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Read declarative onebox partitions
      id: suites
      run: |
        MATRIX="$(python3 -m tests.run --matrix)"
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

    - name: Build and archive strict data and legacy runtime bundles
      run: |
        python3 -m tests.onebox.shared.data --build-bundle "$RUNNER_TEMP/fube-data-binaries"
        tar -cf "$RUNNER_TEMP/fube-data-binaries.tar" -C "$RUNNER_TEMP/fube-data-binaries" .
        # Preserve the v3 artifact contract without rebuilding its app/observer.
        tar -cf "$RUNNER_TEMP/rust-runtime-binaries.tar" -C "$RUNNER_TEMP/fube-data-binaries/legacy" .

    - name: Package standalone native runtime executables
      run: |
        python3 -m tests.native_runtime.runner package --output "$RUNNER_TEMP/native-runtime-binaries"
        tar -cf "$RUNNER_TEMP/native-runtime-binaries.tar" -C "$RUNNER_TEMP/native-runtime-binaries" .

    - name: Upload standalone native runtime bundle
      uses: actions/upload-artifact@v7
      with:
        name: native-runtime-binaries
        overwrite: true
        path: ${{ runner.temp }}/native-runtime-binaries.tar
        if-no-files-found: error
        retention-days: 7

    - name: Upload strict data binary bundle
      uses: actions/upload-artifact@v7
      with:
        name: fube-data-binaries
        overwrite: true
        path: ${{ runner.temp }}/fube-data-binaries.tar
        if-no-files-found: error
        retention-days: 7

    - name: Upload Rust runtime binary bundle
      uses: actions/upload-artifact@v7
      with:
        name: rust-runtime-binaries
        overwrite: true
        path: ${{ runner.temp }}/rust-runtime-binaries.tar
        if-no-files-found: error
        retention-days: 7

    - name: Install pinned nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
        fallback: none

    - name: Build and archive all workspace tests
      run: |
        cargo nextest archive --locked --workspace --all-targets --all-features \
          --archive-file "$RUNNER_TEMP/rust-tests.tar.zst"

    - name: Upload workspace test archive
      uses: actions/upload-artifact@v7
      with:
        name: rust-tests
        overwrite: true
        path: ${{ runner.temp }}/rust-tests.tar.zst
        if-no-files-found: error
        compression-level: 0
        retention-days: 7

    - name: Bind exact current-attempt compiler-free inputs
      id: producer
      run: |
        python3 -m tests.onebox.shared.ci produce \
          --bundle-tar "$RUNNER_TEMP/fube-data-binaries.tar" \
          --bundle-dir "$RUNNER_TEMP/fube-data-binaries" \
          --archive "$RUNNER_TEMP/rust-tests.tar.zst" \
          --standalone-bundle "$RUNNER_TEMP/native-runtime-binaries.tar" \
          --out "$RUNNER_TEMP/onebox-input-receipt.json"
        echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

    - name: Upload current-attempt producer receipt
      uses: actions/upload-artifact@v7
      with:
        name: onebox-inputs-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/onebox-input-receipt.json
        if-no-files-found: error
        retention-days: 7
