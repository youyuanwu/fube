name: Standalone native runtime

on:
  push:
    paths:
    - ".github/workflows/native-runtime.yaml"
    - "tests/__init__.py"
    - "tests/run.py"
    - "tests/suites.py"
    - "tests/suites.toml"
    - "tests/offline/__init__.py"
    - "tests/native_runtime/**"
    - "tests/offline/native_runtime/**"
    - "crates/**"
    - "Cargo.toml"
    - "Cargo.lock"
    - "rust-toolchain.toml"
  pull_request:
    paths:
    - ".github/workflows/native-runtime.yaml"
    - "tests/__init__.py"
    - "tests/run.py"
    - "tests/suites.py"
    - "tests/suites.toml"
    - "tests/offline/__init__.py"
    - "tests/native_runtime/**"
    - "tests/offline/native_runtime/**"
    - "crates/**"
    - "Cargo.toml"
    - "Cargo.lock"
    - "rust-toolchain.toml"
  workflow_dispatch:

jobs:
  linux-native-runtime:
    name: Linux standalone native runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NATIVE_ROOT: build/native-runtime-acceptance-ci
      NATIVE_DIAGNOSTICS: build/native-runtime-acceptance-ci-evidence
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install Rust toolchain with cache
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        cache: true
        rustflags: ""

    - name: Install Ubuntu22 native ABI prerequisites (not Service Fabric)
      timeout-minutes: 5
      run: |
        test "$(uname -m)" = x86_64
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          libcgroup1 liblttng-ust1 libnuma1 libssh2-1
        dpkg-query --show libcgroup1 liblttng-ust1 libnuma1 libssh2-1

    - name: Test native profile preparation and diagnostics
      run: python3 -m tests.run --suite native_runtime_models

    - name: Extract and verify pinned native libraries (no node installation)
      timeout-minutes: 5
      run: python3 -m tests.native_runtime.runner prepare --root "$NATIVE_ROOT"

    - name: Build locked native app and standalone host
      timeout-minutes: 8
      run: |
        cargo build --locked -p fube-test-host -p stateless-test-app
        cargo build --locked -p fube-test-host --example manifest_acceptance

    - name: Native bootstrap, finite lease polling and unregister
      timeout-minutes: 6
      run: |
        python3 -m tests.run --suite native_bootstrap --root "$NATIVE_ROOT" \
          --diagnostics-directory "$NATIVE_DIAGNOSTICS"

    - name: Native Open, ping, Close and graceful reap
      timeout-minutes: 6
      run: |
        python3 -m tests.run --suite native_close --root "$NATIVE_ROOT" \
          --diagnostics-directory "$NATIVE_DIAGNOSTICS"

    - name: Native independent Abort and owned forced reap
      timeout-minutes: 6
      run: |
        python3 -m tests.run --suite native_abort --root "$NATIVE_ROOT" \
          --diagnostics-directory "$NATIVE_DIAGNOSTICS"

    - name: Native manifest defaults, activation metadata, Open, caller ping and Close
      timeout-minutes: 6
      run: |
        python3 -m tests.run --suite native_manifest_close --root "$NATIVE_ROOT" \
          --diagnostics-directory "$NATIVE_DIAGNOSTICS"

    - name: Native manifest overrides, Open, caller ping and independent Abort
      timeout-minutes: 6
      run: |
        python3 -m tests.run --suite native_manifest_abort --root "$NATIVE_ROOT" \
          --diagnostics-directory "$NATIVE_DIAGNOSTICS"

    - name: Retain bounded standalone host and native evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: standalone-native-runtime-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ env.NATIVE_DIAGNOSTICS }}/bootstrap.log
          ${{ env.NATIVE_DIAGNOSTICS }}/bootstrap.json
          ${{ env.NATIVE_DIAGNOSTICS }}/close.log
          ${{ env.NATIVE_DIAGNOSTICS }}/close.json
          ${{ env.NATIVE_DIAGNOSTICS }}/abort.log
          ${{ env.NATIVE_DIAGNOSTICS }}/abort.json
          ${{ env.NATIVE_DIAGNOSTICS }}/manifest-close.log
          ${{ env.NATIVE_DIAGNOSTICS }}/manifest-close.json
          ${{ env.NATIVE_DIAGNOSTICS }}/manifest-abort.log
          ${{ env.NATIVE_DIAGNOSTICS }}/manifest-abort.json
        if-no-files-found: warn
        retention-days: 7
