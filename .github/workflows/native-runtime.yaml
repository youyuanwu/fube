name: Standalone native runtime

on:
  workflow_call:
    inputs:
      producer-attempt:
        required: true
        type: string

jobs:
  linux-native-runtime:
    name: Linux standalone native runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NATIVE_ROOT: build/native-runtime-acceptance-ci
      NATIVE_DIAGNOSTICS: build/native-runtime-acceptance-ci-evidence
      FUBE_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      FUBE_CI_MERGE: ${{ github.event_name == 'pull_request' && github.sha || '' }}
      FUBE_CI_RUN_ID: ${{ github.run_id }}
      FUBE_CI_PRODUCER_ATTEMPT: ${{ inputs.producer-attempt }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Download standalone native runtime bundle
      uses: actions/download-artifact@v8
      with:
        name: native-runtime-binaries
        path: ${{ runner.temp }}/native-runtime-artifact

    - name: Download selected producer receipt
      uses: actions/download-artifact@v8
      with:
        name: onebox-inputs-${{ github.run_id }}-${{ inputs.producer-attempt }}
        path: ${{ runner.temp }}/onebox-inputs

    - name: Verify and extract standalone build inputs
      run: |
        python3 -m tests.onebox.shared.ci verify-artifact \
          --producer "$RUNNER_TEMP/onebox-inputs/onebox-input-receipt.json" \
          --input standalone_bundle --file "$RUNNER_TEMP/native-runtime-artifact/native-runtime-binaries.tar" \
          --out "$RUNNER_TEMP/validated-standalone-input.json"
        python3 -c 'import os,tarfile; from pathlib import Path; root=Path(os.environ["RUNNER_TEMP"]); target=root/"native-runtime-binaries"; target.mkdir(); tarfile.open(root/"native-runtime-artifact/native-runtime-binaries.tar").extractall(target,filter="data")'

    - name: Install Ubuntu22 native ABI prerequisites (not Service Fabric)
      timeout-minutes: 5
      run: |
        test "$(uname -m)" = x86_64
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          libcgroup1 liblttng-ust1 libnuma1 libssh2-1
        dpkg-query --show libcgroup1 liblttng-ust1 libnuma1 libssh2-1

    - name: Extract and verify pinned native libraries (no node installation)
      timeout-minutes: 5
      run: python3 -m tests.native_runtime.runner prepare --root "$NATIVE_ROOT"

    - name: Native bootstrap, finite lease polling and unregister
      timeout-minutes: 6
      run: |
        python3 -m tests.run --suite native_bootstrap --root "$NATIVE_ROOT" \
          --prebuilt "$RUNNER_TEMP/native-runtime-binaries" \
          --diagnostics-directory "$NATIVE_DIAGNOSTICS"

    - name: Native Open, ping, Close and graceful reap
      timeout-minutes: 6
      run: |
        python3 -m tests.run --suite native_close --root "$NATIVE_ROOT" \
          --prebuilt "$RUNNER_TEMP/native-runtime-binaries" \
          --diagnostics-directory "$NATIVE_DIAGNOSTICS"

    - name: Native independent Abort and owned forced reap
      timeout-minutes: 6
      run: |
        python3 -m tests.run --suite native_abort --root "$NATIVE_ROOT" \
          --prebuilt "$RUNNER_TEMP/native-runtime-binaries" \
          --diagnostics-directory "$NATIVE_DIAGNOSTICS"

    - name: Native manifest defaults, activation metadata, Open, caller ping and Close
      timeout-minutes: 6
      run: |
        python3 -m tests.run --suite native_manifest_close --root "$NATIVE_ROOT" \
          --prebuilt "$RUNNER_TEMP/native-runtime-binaries" \
          --diagnostics-directory "$NATIVE_DIAGNOSTICS"

    - name: Native manifest overrides, Open, caller ping and independent Abort
      timeout-minutes: 6
      run: |
        python3 -m tests.run --suite native_manifest_abort --root "$NATIVE_ROOT" \
          --prebuilt "$RUNNER_TEMP/native-runtime-binaries" \
          --diagnostics-directory "$NATIVE_DIAGNOSTICS"

    - name: Retain failed or cancelled standalone diagnostics
      if: failure() || cancelled()
      uses: actions/upload-artifact@v7
      with:
        name: standalone-native-runtime-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/validated-standalone-input.json
          ${{ env.NATIVE_DIAGNOSTICS }}/bootstrap.log
          ${{ env.NATIVE_DIAGNOSTICS }}/bootstrap.json
          ${{ env.NATIVE_DIAGNOSTICS }}/close.log
          ${{ env.NATIVE_DIAGNOSTICS }}/close.json
          ${{ env.NATIVE_DIAGNOSTICS }}/abort.log
          ${{ env.NATIVE_DIAGNOSTICS }}/abort.json
          ${{ env.NATIVE_DIAGNOSTICS }}/manifest-close.log
          ${{ env.NATIVE_DIAGNOSTICS }}/manifest-close.json
          ${{ env.NATIVE_DIAGNOSTICS }}/manifest-abort.log
          ${{ env.NATIVE_DIAGNOSTICS }}/manifest-abort.json
        if-no-files-found: warn
        retention-days: 7
