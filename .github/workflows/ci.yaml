name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust-build:
    name: Rust artifacts
    uses: ./.github/workflows/rust-build.yaml
    permissions:
      contents: read

  rust-tests:
    name: Rust workspace tests (archived)
    needs: rust-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Runtime model tests own thread pools; avoid cross-test runner contention.
      NEXTEST_TEST_THREADS: "1"
      FUBE_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      FUBE_CI_MERGE: ${{ github.event_name == 'pull_request' && github.sha || '' }}
      FUBE_CI_RUN_ID: ${{ github.run_id }}
      FUBE_CI_PRODUCER_ATTEMPT: ${{ needs.rust-build.outputs.producer-attempt }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - uses: actions/download-artifact@v8
      with:
        name: rust-tests
        path: ${{ runner.temp }}/rust-tests
    - uses: actions/download-artifact@v8
      with:
        name: onebox-inputs-${{ github.run_id }}-${{ needs.rust-build.outputs.producer-attempt }}
        path: ${{ runner.temp }}/onebox-inputs
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest@${{ needs.rust-build.outputs.nextest-version }}
        fallback: none
    - name: Verify selected producer workspace archive
      run: |
        python3 -m tests.onebox.shared.ci verify-artifact \
          --producer "$RUNNER_TEMP/onebox-inputs/onebox-input-receipt.json" \
          --input native_archive --file "$RUNNER_TEMP/rust-tests/rust-tests.tar.zst" \
          --out "$RUNNER_TEMP/validated-test-archive.json"
    - name: Execute offline workspace tests without compiling
      run: python3 -m tests.run --suite rust_tests --archive "$RUNNER_TEMP/rust-tests/rust-tests.tar.zst"

  rust-quality:
    name: Rust quality and doctests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        components: rustfmt, clippy
        cache: true
        rustflags: ""
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Check production-only native-free libraries
      run: cargo check --locked -p fube-transport -p fube-client -p fube-test-host -p fube-ra-store --lib
    - name: Lint all workspace targets and features
      run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
    - name: Build workspace API documentation
      run: cargo doc --locked --workspace --all-features --no-deps
      env:
        RUSTDOCFLAGS: -D warnings
    - name: Test documentation examples
      run: cargo test --locked --workspace --all-features --doc

  python-tests:
    name: Python offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - run: python3 -m tests.run --suite offline

  standalone:
    name: Standalone native runtime
    needs: rust-build
    uses: ./.github/workflows/native-runtime.yaml
    with:
      producer-attempt: ${{ needs.rust-build.outputs.producer-attempt }}
    permissions:
      contents: read

  onebox-workers:
    name: Linux onebox (${{ matrix.route }})
    needs: rust-build
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    outputs:
      client-runtime-artifact: ${{ steps.evidence.outputs.client-runtime }}
      client-runtime-attempt: ${{ steps.evidence.outputs.client-runtime-attempt }}
      native-data-artifact: ${{ steps.evidence.outputs.native-data }}
      native-data-attempt: ${{ steps.evidence.outputs.native-data-attempt }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.rust-build.outputs.onebox-matrix) }}
    env:
      WORKER_ROUTE: ${{ matrix.route }}
      CLUSTER_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
      FUBE_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      FUBE_CI_MERGE: ${{ github.event_name == 'pull_request' && github.sha || '' }}
      FUBE_CI_RUN_ID: ${{ github.run_id }}
      FUBE_CI_PRODUCER_ATTEMPT: ${{ needs.rust-build.outputs.producer-attempt }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Download strict data binary bundle
      uses: actions/download-artifact@v8
      with:
        name: fube-data-binaries
        path: ${{ runner.temp }}/fube-data-artifact

    - name: Download selected producer receipt
      uses: actions/download-artifact@v8
      with:
        name: onebox-inputs-${{ github.run_id }}-${{ needs.rust-build.outputs.producer-attempt }}
        path: ${{ runner.temp }}/onebox-inputs

    - name: Download workspace test archive
      if: matrix.archive
      uses: actions/download-artifact@v8
      with:
        name: rust-tests
        path: ${{ runner.temp }}/rust-tests

    - name: Extract strict inputs into a new directory
      run: |
        python3 -c 'import os,tarfile; from pathlib import Path; root=Path(os.environ["RUNNER_TEMP"]); target=root/"fube-data-binaries"; target.mkdir(); tarfile.open(root/"fube-data-artifact/fube-data-binaries.tar").extractall(target,filter="data"); (root/"onebox-proof"/os.environ["WORKER_ROUTE"]).mkdir(parents=True)'

    - name: Install pinned nextest
      id: install_nextest
      if: matrix.archive
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest@${{ needs.rust-build.outputs.nextest-version }}
        fallback: none

    - name: Check runner prerequisites
      run: |
        docker info
        docker compose version
        ip -j -4 route
        free -h
        df -h /

    - name: Build pinned Ubuntu image
      id: image
      run: docker build --tag sf-apps-onebox:11.8.121.4 --file docker/onebox/Dockerfile docker

    - name: Run the declared partition with its onebox fixture
      id: partition
      run: |
        ARGS=(--partition "$WORKER_ROUTE" --name "$CLUSTER_NAME"
          --bundle-tar "$RUNNER_TEMP/fube-data-artifact/fube-data-binaries.tar"
          --prebuilt "$RUNNER_TEMP/fube-data-binaries"
          --producer "$RUNNER_TEMP/onebox-inputs/onebox-input-receipt.json"
          --github-output "$GITHUB_OUTPUT"
          --report-dir "$RUNNER_TEMP/onebox-proof/$WORKER_ROUTE")
        if [ "${{ matrix.archive }}" = true ]; then
          ARGS+=(--archive "$RUNNER_TEMP/rust-tests/rust-tests.tar.zst"
            --config-dir "$RUNNER_TEMP/onebox-configs"
            --fixture-owner "ci-${{ github.run_id }}-${{ github.run_attempt }}")
        fi
        python3 -m tests.run "${ARGS[@]}"

    - name: Emergency cleanup of the original allocation
      if: always() && steps.partition.outputs.owner != '' && steps.partition.outputs.cleaned != 'true'
      timeout-minutes: 4
      run: |
        python3 -m tests.onebox.shared.ci cleanup --name "$CLUSTER_NAME" \
          --owner "${{ steps.partition.outputs.owner }}" --route "$WORKER_ROUTE" \
          --producer "$RUNNER_TEMP/onebox-inputs/onebox-input-receipt.json" \
          --report "$RUNNER_TEMP/onebox-proof/$WORKER_ROUTE/emergency-cleanup.json"

    - name: Seal actual suite and post-teardown evidence
      if: always()
      run: |
        python3 -m tests.onebox.shared.ci seal --route "$WORKER_ROUTE" \
          --producer "$RUNNER_TEMP/onebox-inputs/onebox-input-receipt.json" \
          --validated-input "$RUNNER_TEMP/onebox-proof/$WORKER_ROUTE/validated-input.json" \
          --evidence-dir "$RUNNER_TEMP/onebox-proof/$WORKER_ROUTE" \
          --out "$RUNNER_TEMP/onebox-proof/$WORKER_ROUTE/worker-proof.json"

    - name: Upload this worker's complete evidence after teardown
      id: upload_evidence
      if: always()
      timeout-minutes: 4
      uses: actions/upload-artifact@v7
      with:
        name: onebox-worker-${{ matrix.route }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/onebox-proof
        if-no-files-found: error
        retention-days: 7

    - name: Publish this worker's immutable evidence identity
      id: evidence
      if: always()
      env:
        ARTIFACT_ID: ${{ steps.upload_evidence.outputs.artifact-id }}
      run: |
        test -n "$ARTIFACT_ID"
        echo "$WORKER_ROUTE=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
        echo "$WORKER_ROUTE-attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  linux-onebox:
    # Keep the existing required-check name; only this aggregate claims the
    # complete 32 namespaced profile assertions plus five archived native tests.
    name: Linux onebox native client
    needs: [rust-build, onebox-workers, rust-tests, rust-quality, python-tests, standalone]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FUBE_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      FUBE_CI_MERGE: ${{ github.event_name == 'pull_request' && github.sha || '' }}
      FUBE_CI_RUN_ID: ${{ github.run_id }}
      FUBE_CI_PRODUCER_ATTEMPT: ${{ needs.rust-build.outputs.producer-attempt }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Download producer identity
      uses: actions/download-artifact@v8
      with:
        name: onebox-inputs-${{ github.run_id }}-${{ needs.rust-build.outputs.producer-attempt }}
        path: ${{ runner.temp }}/onebox-inputs

    - name: Download all declared worker proofs
      if: always()
      uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ needs.onebox-workers.outputs.client-runtime-artifact }},${{ needs.onebox-workers.outputs.native-data-artifact }}
        path: ${{ runner.temp }}/onebox-workers
        merge-multiple: true

    - name: Verify complete namespaced coverage and original cleanup
      if: always()
      env:
        PRODUCER_RESULT: ${{ needs.rust-build.result }}
        WORKERS_RESULT: ${{ needs.onebox-workers.result }}
        RUST_TESTS_RESULT: ${{ needs.rust-tests.result }}
        RUST_QUALITY_RESULT: ${{ needs.rust-quality.result }}
        PYTHON_TESTS_RESULT: ${{ needs.python-tests.result }}
        STANDALONE_RESULT: ${{ needs.standalone.result }}
        WORKER_ATTEMPTS: '{"client-runtime":"${{ needs.onebox-workers.outputs.client-runtime-attempt }}","native-data":"${{ needs.onebox-workers.outputs.native-data-attempt }}"}'
      run: |
        NEEDS_STATUS="$(python3 -c 'import json,os; names=("producer","workers","rust_tests","rust_quality","python_tests","standalone"); print(json.dumps({name:os.environ[name.upper()+"_RESULT"] for name in names}))')"
        python3 -m tests.onebox.shared.ci aggregate \
          --producer "$RUNNER_TEMP/onebox-inputs/onebox-input-receipt.json" \
          --worker-root "$RUNNER_TEMP/onebox-workers" --needs-json "$NEEDS_STATUS" \
          --worker-attempts-json "$WORKER_ATTEMPTS" \
          --out "$RUNNER_TEMP/onebox-aggregate.json"

    - name: Upload complete aggregate or explicit failure
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: onebox-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/onebox-aggregate.json
        if-no-files-found: error
        retention-days: 7
