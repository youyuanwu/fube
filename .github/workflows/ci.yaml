name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust-build:
    name: Rust artifacts
    uses: ./.github/workflows/rust-build.yaml
    permissions:
      contents: read

  rust-tests:
    name: Rust workspace tests (archived)
    needs: rust-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Runtime model tests own thread pools; avoid cross-test runner contention.
      NEXTEST_TEST_THREADS: "1"
      FUBE_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      FUBE_CI_MERGE: ${{ github.event_name == 'pull_request' && github.sha || '' }}
      FUBE_CI_RUN_ID: ${{ github.run_id }}
      FUBE_CI_PRODUCER_ATTEMPT: ${{ needs.rust-build.outputs.producer-attempt }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - uses: actions/download-artifact@v8
      with:
        name: rust-tests
        path: ${{ runner.temp }}/rust-tests
    - uses: actions/download-artifact@v8
      with:
        name: onebox-inputs-${{ github.run_id }}-${{ needs.rust-build.outputs.producer-attempt }}
        path: ${{ runner.temp }}/onebox-inputs
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest@${{ needs.rust-build.outputs.nextest-version }}
        fallback: none
    - name: Verify selected producer workspace archive
      run: |
        python3 -m tests.onebox.shared.ci verify-artifact \
          --producer "$RUNNER_TEMP/onebox-inputs/onebox-input-receipt.json" \
          --input native_archive --file "$RUNNER_TEMP/rust-tests/rust-tests.tar.zst" \
          --out "$RUNNER_TEMP/validated-test-archive.json"
    - name: Execute offline workspace tests without compiling
      run: python3 -m tests.run --suite rust_tests --archive "$RUNNER_TEMP/rust-tests/rust-tests.tar.zst"

  rust-quality:
    name: Rust quality and doctests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        components: rustfmt, clippy
        cache: true
        rustflags: ""
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Check production-only native-free libraries
      run: cargo check --locked -p fube-transport -p fube-client -p fube-test-host -p fube-ra-store --lib
    - name: Lint all workspace targets and features
      run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
    - name: Build workspace API documentation
      run: cargo doc --locked --workspace --all-features --no-deps
      env:
        RUSTDOCFLAGS: -D warnings
    - name: Test documentation examples
      run: cargo test --locked --workspace --all-features --doc

  python-tests:
    name: Python offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - run: python3 -m tests.run --suite offline

  standalone:
    name: Standalone native runtime
    needs: rust-build
    uses: ./.github/workflows/native-runtime.yaml
    with:
      producer-attempt: ${{ needs.rust-build.outputs.producer-attempt }}
    permissions:
      contents: read

  onebox-workers:
    name: Linux onebox (${{ matrix.route }})
    needs: rust-build
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.rust-build.outputs.onebox-matrix) }}
    env:
      WORKER_ROUTE: ${{ matrix.route }}
      CLUSTER_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
      FUBE_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      FUBE_CI_MERGE: ${{ github.event_name == 'pull_request' && github.sha || '' }}
      FUBE_CI_RUN_ID: ${{ github.run_id }}
      FUBE_CI_PRODUCER_ATTEMPT: ${{ needs.rust-build.outputs.producer-attempt }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Download strict data binary bundle
      uses: actions/download-artifact@v8
      with:
        name: fube-data-binaries
        path: ${{ runner.temp }}/fube-data-artifact

    - name: Download selected producer receipt
      uses: actions/download-artifact@v8
      with:
        name: onebox-inputs-${{ github.run_id }}-${{ needs.rust-build.outputs.producer-attempt }}
        path: ${{ runner.temp }}/onebox-inputs

    - name: Download workspace test archive
      if: matrix.archive
      uses: actions/download-artifact@v8
      with:
        name: rust-tests
        path: ${{ runner.temp }}/rust-tests

    - name: Extract strict inputs into a new directory
      run: |
        python3 -c 'import os,tarfile; from pathlib import Path; root=Path(os.environ["RUNNER_TEMP"]); target=root/"fube-data-binaries"; target.mkdir(); tarfile.open(root/"fube-data-artifact/fube-data-binaries.tar").extractall(target,filter="data")'

    - name: Install pinned nextest
      id: install_nextest
      if: matrix.archive
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest@${{ needs.rust-build.outputs.nextest-version }}
        fallback: none

    - name: Check runner prerequisites
      run: |
        docker info
        docker compose version
        ip -j -4 route
        free -h
        df -h /

    - name: Build pinned Ubuntu image
      id: image
      run: docker build --tag sf-apps-onebox:11.8.121.4 --file docker/onebox/Dockerfile docker

    - name: Run the declared partition with its onebox fixture
      id: partition
      run: |
        ARGS=(--partition "$WORKER_ROUTE" --name "$CLUSTER_NAME"
          --bundle-tar "$RUNNER_TEMP/fube-data-artifact/fube-data-binaries.tar"
          --prebuilt "$RUNNER_TEMP/fube-data-binaries"
          --producer "$RUNNER_TEMP/onebox-inputs/onebox-input-receipt.json"
          --github-output "$GITHUB_OUTPUT"
          --report-dir "$RUNNER_TEMP/onebox-proof/$WORKER_ROUTE")
        if [ "${{ matrix.archive }}" = true ]; then
          ARGS+=(--archive "$RUNNER_TEMP/rust-tests/rust-tests.tar.zst"
            --config-dir "$RUNNER_TEMP/onebox-configs"
            --fixture-owner "ci-${{ github.run_id }}-${{ github.run_attempt }}")
        fi
        python3 -m tests.run "${ARGS[@]}"

    - name: Emergency cleanup of the original allocation
      if: always() && steps.partition.outputs.owner != '' && steps.partition.outputs.cleaned != 'true'
      timeout-minutes: 4
      run: |
        python3 -m tests.onebox.shared.ci cleanup --name "$CLUSTER_NAME" \
          --owner "${{ steps.partition.outputs.owner }}" --route "$WORKER_ROUTE" \
          --producer "$RUNNER_TEMP/onebox-inputs/onebox-input-receipt.json" \
          --report "$RUNNER_TEMP/onebox-proof/$WORKER_ROUTE/emergency-cleanup.json"

    - name: Retain failed or cancelled worker diagnostics
      if: failure() || cancelled()
      timeout-minutes: 4
      uses: actions/upload-artifact@v7
      with:
        name: onebox-worker-${{ matrix.route }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/onebox-proof
        if-no-files-found: warn
        retention-days: 7

  linux-onebox:
    # Keep the existing required-check name; each worker validates its own tests.
    name: Linux onebox native client
    needs: [rust-build, onebox-workers, rust-tests, rust-quality, python-tests, standalone]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Require every test and build job to succeed
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json, os, sys
        results = {name: job["result"] for name, job in json.loads(os.environ["NEEDS_JSON"]).items()}
        for name, result in results.items():
            print(f"{name}: {result}")
        sys.exit(0 if results and all(result == "success" for result in results.values()) else 1)
        PY
