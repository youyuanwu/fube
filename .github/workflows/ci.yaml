name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust-native-client-linux:
    name: Native-free Rust client (ubuntu-24.04)
    uses: ./.github/workflows/native-client.yaml
    permissions:
      contents: read
    with:
      os: ubuntu-24.04

  rust-native-client-windows:
    name: Native-free Rust client (windows-latest)
    uses: ./.github/workflows/native-client.yaml
    permissions:
      contents: read
    with:
      os: windows-latest

  linux-onebox:
    name: Linux onebox native client
    needs: rust-native-client-linux
    runs-on: ubuntu-24.04
    # Full data/interop repeats 180s convergence and 240s FAS waits across 17
    # scenarios, plus 300s ledger saturation and the preserved full legacy tier.
    # Reserve 150m for qualification and 30m for setup, evidence and teardown.
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CLUSTER_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
      CLUSTER_CTL: scripts/onebox_ctl.py
      CLUSTER_STATE_ROOT: build/oneboxes
      # Review identity stays unset; executable identity comes from the bundle.
      FUBE_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      FUBE_CI_MERGE: ${{ github.event_name == 'pull_request' && github.sha || '' }}
      FUBE_CI_RUN_ID: ${{ github.run_id }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install pinned nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest@${{ needs.rust-native-client-linux.outputs.nextest-version }}
        fallback: none

    - name: Download native-client test archive
      uses: actions/download-artifact@v8
      with:
        name: native-client-tests
        path: ${{ runner.temp }}/native-client-tests

    - name: Download strict data binary bundle
      uses: actions/download-artifact@v8
      with:
        name: fube-data-binaries
        path: ${{ runner.temp }}/fube-data-artifact

    - name: Extract strict data binaries and nested legacy bundle
      run: |
        mkdir "$RUNNER_TEMP/fube-data-binaries"
        tar -xf "$RUNNER_TEMP/fube-data-artifact/fube-data-binaries.tar" \
          -C "$RUNNER_TEMP/fube-data-binaries"

    - name: Check runner prerequisites
      run: |
        docker info
        docker compose version
        ip -j -4 route
        free -h
        df -h /

    - name: Test Linux lifecycle harnesses
      run: python3 -m unittest discover -s scripts -p "test_linux*.py"

    - name: Build pinned Ubuntu image
      run: docker build --tag sf-apps-onebox:11.8.121.4 --file docker/onebox/Dockerfile docker

    - name: Create native development cluster
      id: create_cluster
      run: python3 "$CLUSTER_CTL" create "$CLUSTER_NAME" --github-output "$GITHUB_OUTPUT"

    - name: Check fresh cluster health
      run: python3 "$CLUSTER_CTL" status "$CLUSTER_NAME" > "$RUNNER_TEMP/linux-cluster-status-created.json"

    - name: Exercise real native reads, health, lists and owned fixtures
      id: native_client
      run: |
        export MSSF_TEST_ARCHIVE_SHA256="$(sha256sum "$RUNNER_TEMP/native-client-tests/native-client-tests.tar.zst" | cut -d ' ' -f 1)"
        cargo-nextest nextest run \
          --archive-file "$RUNNER_TEMP/native-client-tests/native-client-tests.tar.zst" \
          --workspace-remap "$GITHUB_WORKSPACE" \
          --run-ignored all -E 'group(onebox)' --no-tests fail
      env:
        MSSF_TEST_CONFIG: ${{ runner.temp }}/native-client-config.json
        MSSF_TEST_REPORT: ${{ runner.temp }}/native-client-report.json
        MSSF_HEALTH_CONFIG: ${{ runner.temp }}/native-health-config.json
        MSSF_HEALTH_REPORT: ${{ runner.temp }}/native-health-report.json
        MSSF_HEALTH_OWNER: ci-${{ github.run_id }}-${{ github.run_attempt }}
        MSSF_NAME_CONFIG: ${{ runner.temp }}/native-name-config.json
        MSSF_NAME_REPORT: ${{ runner.temp }}/native-name-report.json
        MSSF_NAME_OWNER: ci-${{ github.run_id }}-${{ github.run_attempt }}
        MSSF_LIST_CONFIG: ${{ runner.temp }}/native-list-config.json
        MSSF_LIST_REPORT: ${{ runner.temp }}/native-list-report.json
        MSSF_LIST_OWNER: ci-${{ github.run_id }}-${{ github.run_attempt }}
        MSSF_NOTIFICATION_CONFIG: ${{ runner.temp }}/native-notification-config.json
        MSSF_NOTIFICATION_ALLOCATION: ${{ env.CLUSTER_NAME }}
        MSSF_NOTIFICATION_JOURNAL: ${{ runner.temp }}/native-notification-journal.json
        MSSF_NOTIFICATION_REPORT: ${{ runner.temp }}/native-notification-report.json

    - name: Qualify Rust-only data, native interoperability and full legacy runtime
      id: native_data
      timeout-minutes: 150
      run: |
        python3 scripts/fube_data_test.py "$CLUSTER_NAME" --existing-owner "${{ steps.create_cluster.outputs.owner }}" \
          --prebuilt "$RUNNER_TEMP/fube-data-binaries" \
          --profile rust --report "$RUNNER_TEMP/fube-data-rust-report.json"
        python3 scripts/fube_data_test.py "$CLUSTER_NAME" --existing-owner "${{ steps.create_cluster.outputs.owner }}" \
          --prebuilt "$RUNNER_TEMP/fube-data-binaries" \
          --profile full --report "$RUNNER_TEMP/fube-data-report.json"

    - name: Upload successful combined data and legacy runtime evidence
      if: always() && steps.native_data.outcome == 'success'
      timeout-minutes: 2
      uses: actions/upload-artifact@v7
      with:
        name: fube-data-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/fube-data-rust-report.json
          ${{ runner.temp }}/fube-data-report.json
        if-no-files-found: error
        retention-days: 7

    - name: Upload failed combined data and legacy runtime evidence
      if: always() && steps.native_data.outcome != 'success'
      timeout-minutes: 2
      uses: actions/upload-artifact@v7
      with:
        name: fube-data-failure-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/fube-data-rust-report.json
          ${{ runner.temp }}/fube-data-report.json
        if-no-files-found: warn
        retention-days: 7

    - name: Upload successful native client evidence
      if: steps.native_client.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: native-client-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/native-client-report.json
          ${{ runner.temp }}/native-health-report.json
          ${{ runner.temp }}/native-name-report.json
          ${{ runner.temp }}/native-list-report.json
          ${{ runner.temp }}/native-notification-report.json
        if-no-files-found: error
        retention-days: 7

    - name: Capture credential-safe diagnostics
      if: always()
      timeout-minutes: 2
      run: |
        python3 scripts/linux_cluster_diagnostics.py "$CLUSTER_NAME" --onebox \
          --output "$RUNNER_TEMP/linux-cluster-diagnostics/diagnostics.json"

    - name: Upload onebox diagnostics
      if: always()
      timeout-minutes: 2
      uses: actions/upload-artifact@v7
      with:
        name: linux-onebox-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/linux-cluster-diagnostics/diagnostics.json
        if-no-files-found: error
        retention-days: 7

    - name: Destroy only this job's cluster
      if: always() && steps.create_cluster.outputs.owner != ''
      timeout-minutes: 4
      run: |
        python3 -c 'import os,sys,json; sys.path.insert(0,"scripts"); import rust_runtime_test as r; print(json.dumps(r.destroy_owned(os.environ["CLUSTER_NAME"],sys.argv[1])))' '${{ steps.create_cluster.outputs.owner }}'
