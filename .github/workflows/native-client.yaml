name: Native-free Rust client

on:
  workflow_call:
    inputs:
      os:
        description: Runner operating system for the native-free checks
        required: true
        type: string
    outputs:
      nextest-version:
        description: Pinned nextest version used to build the test archive
        value: ${{ jobs.rust-native-client.outputs.nextest-version }}

env:
  NEXTEST_VERSION: "0.9.146"

jobs:
  rust-native-client:
    name: Native-free Rust client
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.os == 'ubuntu-24.04' && 30 || 15 }}
    permissions:
      contents: read
    outputs:
      nextest-version: ${{ env.NEXTEST_VERSION }}
    env:
      FUBE_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      FUBE_CI_MERGE: ${{ github.event_name == 'pull_request' && github.sha || '' }}
      FUBE_CI_RUN_ID: ${{ github.run_id }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install Rust toolchain with cache
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        components: rustfmt, clippy
        cache: true
        rustflags: ""

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Check production-only native-client libraries
      run: cargo check --locked -p mssf-transport -p mssf-client -p mssf-test-host --lib

    - name: Check native app fixture
      run: cargo check --locked -p stateless-test-app

    - name: Test Linux Rust runtime, data and native oracle models
      if: runner.os == 'Linux'
      run: |
        cargo test --locked -p mssf-runtime -p fube-data -p rust-runtime-app -p native-replicator-oracle
        cargo clippy --locked -p mssf-runtime -p fube-data -p rust-runtime-app -p native-replicator-oracle --all-targets -- -D warnings
        RUSTDOCFLAGS='-D warnings' cargo doc --locked -p mssf-runtime -p fube-data -p rust-runtime-app -p native-replicator-oracle --no-deps

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Build and archive strict data and legacy runtime bundles
      if: runner.os == 'Linux'
      run: |
        python3 scripts/fube_data_test.py --build-bundle "$RUNNER_TEMP/fube-data-binaries"
        tar -cf "$RUNNER_TEMP/fube-data-binaries.tar" -C "$RUNNER_TEMP/fube-data-binaries" .
        # Preserve the v3 artifact contract without rebuilding its app/observer.
        tar -cf "$RUNNER_TEMP/rust-runtime-binaries.tar" -C "$RUNNER_TEMP/fube-data-binaries/legacy" .

    - name: Upload strict data binary bundle
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v7
      with:
        name: fube-data-binaries
        path: ${{ runner.temp }}/fube-data-binaries.tar
        if-no-files-found: error
        retention-days: 7

    - name: Upload Rust runtime binary bundle
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v7
      with:
        name: rust-runtime-binaries
        path: ${{ runner.temp }}/rust-runtime-binaries.tar
        if-no-files-found: error
        retention-days: 7

    - name: Test Python harnesses
      run: python -m unittest discover -s scripts -p "test_*.py"

    - name: Install pinned nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
        fallback: none

    - name: Build and archive native-client tests
      run: |
        cargo nextest archive --locked -p mssf-transport -p mssf-client -p mssf-test-host \
          --archive-file "$RUNNER_TEMP/native-client-tests.tar.zst"

    - name: Test isolated native-free packages
      run: |
        cargo nextest run --archive-file "$RUNNER_TEMP/native-client-tests.tar.zst" \
          -E 'not group(onebox)' --no-tests fail

    - name: Lint native-free packages
      run: cargo clippy --locked -p mssf-transport -p mssf-client -p mssf-test-host --all-targets -- -D warnings

    - name: Build API documentation
      run: cargo doc --locked -p mssf-transport -p mssf-client -p mssf-test-host --no-deps
      env:
        RUSTDOCFLAGS: -D warnings

    - name: Upload native-client test archive
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v7
      with:
        name: native-client-tests
        path: ${{ runner.temp }}/native-client-tests.tar.zst
        if-no-files-found: error
        compression-level: 0
        overwrite: true
        retention-days: 7

    - name: Bind exact current-attempt compiler-free inputs
      if: runner.os == 'Linux'
      run: |
        python3 scripts/onebox_ci.py produce \
          --bundle-tar "$RUNNER_TEMP/fube-data-binaries.tar" \
          --bundle-dir "$RUNNER_TEMP/fube-data-binaries" \
          --archive "$RUNNER_TEMP/native-client-tests.tar.zst" \
          --out "$RUNNER_TEMP/onebox-input-receipt.json"

    - name: Upload current-attempt producer receipt
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v7
      with:
        name: onebox-inputs-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/onebox-input-receipt.json
        if-no-files-found: error
        retention-days: 7
