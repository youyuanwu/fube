[workspace]
resolver = "2"
members = [
  "crates/libs/fube-transport",
  "crates/libs/fube-client",
  "crates/libs/fube-test-host",
  "crates/libs/fube-runtime",
  "crates/libs/fube-data",
  "crates/libs/fube-txn",
  "crates/libs/fube-ra-store",
  "crates/libs/fube-ra",
  "crates/samples/stateless-test-app",
  "crates/samples/rust-runtime-app",
  "crates/samples/native-replicator-oracle",
]

[workspace.dependencies]
fube-transport = { path = "./crates/libs/fube-transport" }
fube-client = { path = "./crates/libs/fube-client" }
fube-runtime = { path = "./crates/libs/fube-runtime" }
fube-data = { path = "./crates/libs/fube-data" }
fube-txn = { path = "./crates/libs/fube-txn" }
mssf-core = "0.10"
mssf-util = "0.10"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde = {version = "1", features = ["derive"]}
bitflags = { version = "2", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
openapi-service-fabric = { version = "0.1.1", default-features = false }
time = { version = "0.3", default-features = false, features = ["parsing"] }
